services:
  livekit-server:
    image: livekit/livekit-server:latest
    container_name: elmkusoma-livekit
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "5349:5349/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    command: --config /etc/livekit.yaml --bind 0.0.0.0
    environment:
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=devsecret-devsecret-devsecret-dev01!
      - LIVEKIT_WS_PORT=7880
      - LIVEKIT_TCP_PORT=7881
      - LIVEKIT_UDP_PORT=5349
      # Resolved by livekit.yaml into webhook.urls so the server can notify ELMKUSOMA
      # about egress (recording) lifecycle and room close.
      - LIVEKIT_WEBHOOK_URL=${LIVEKIT_WEBHOOK_URL:-http://host.docker.internal:8080/v1/webhooks/livekit}
    # host.docker.internal is implicit on Docker Desktop; on plain Linux it must be mapped.
    extra_hosts:
      - "host.docker.internal:host-gateway"
