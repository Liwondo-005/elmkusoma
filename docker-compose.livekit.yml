version: "3.9"

services:
  livekit-server:
    image: livekit/livekit-server:latest
    container_name: elmkusoma-livekit
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "5349:5349/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    command: --config /etc/livekit.yaml --bind 0.0.0.0
    environment:
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=devsecret
      - LIVEKIT_WS_PORT=7880
      - LIVEKIT_TCP_PORT=7881
      - LIVEKIT_UDP_PORT=5349

  redis:
    image: redis:7-alpine
    container_name: elmkusoma-livekit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - livekit-redis-data:/data

  livekit_egress:
    image: livekit/livekit-egress:latest
    container_name: elmkusoma-livekit-egress
    restart: unless-stopped
    depends_on:
      - livekit-server
    volumes:
      - ./recordings:/recordings
    environment:
      - LIVEKIT_URL=ws://livekit-server:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=devsecret

volumes:
  livekit-redis-data:
