server:
  port: 8082

spring:
  application:
    name: elmkusoma-workers

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:elmkusoma}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    # Dedicated history table: core owns flyway_schema_history;
    # workers manages only its own db/migration scripts (V001...) here.
    table: flyway_workers_history
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: 1
        max-concurrency: 5
        prefetch: 10

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  thymeleaf:
    check-template-location: true
    prefix: classpath:/templates/email/
    suffix: .html
    cache: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  workers:
    certificate:
      storage-path: ./certificates
      template-path: classpath:templates/certificate/

management:
  endpoints:
    web:
      exposure:
        include: health,info
  # Gmail app-password is provisioned per environment; don't fail the
  # service health check when mail isn't configured yet.
  health:
    mail:
      enabled: false
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api/v1/workers/docs
  swagger-ui:
    path: /api/v1/workers/swagger-ui.html
