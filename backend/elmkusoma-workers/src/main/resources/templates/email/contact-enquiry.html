<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>New Elmkusoma enquiry</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
        }
        .header {
            background-color: #1a5276;
            color: #ffffff;
            padding: 30px 20px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
        }
        .content {
            padding: 30px 20px;
        }
        .field {
            margin-bottom: 20px;
        }
        .field-label {
            color: #5d6d7e;
            font-size: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .field-value {
            color: #2c3e50;
            font-size: 15px;
            word-break: break-word;
        }
        .message-body {
            background-color: #f8f9f9;
            border-left: 4px solid #1a5276;
            padding: 15px;
            color: #2c3e50;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .footer {
            background-color: #fafafa;
            padding: 20px;
            text-align: center;
            color: #95a5a6;
            font-size: 12px;
        }
        @media only screen and (max-width: 600px) {
            .container {
                width: 100% !important;
            }
            .content {
                padding: 20px 15px !important;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!--
      Recipient: the configured support / administrator address.
      A visitor cannot choose this destination; it comes from site settings.
      Every value below is visitor-supplied and is rendered with th:text, which
      HTML-escapes it. th:utext is deliberately never used here, so a submission
      containing markup cannot inject HTML or script into this message.
    -->
    <div class="header">
        <h1>New Enquiry</h1>
    </div>

    <div class="content">
        <div class="field">
            <div class="field-label">Reference</div>
            <div class="field-value" th:text="${reference}">REF-0000</div>
        </div>

        <div class="field">
            <div class="field-label">Received from</div>
            <div class="field-value" th:text="${name}">Visitor name</div>
        </div>

        <div class="field">
            <div class="field-label">Reply-to address</div>
            <div class="field-value" th:text="${email}">visitor@example.com</div>
        </div>

        <div class="field">
            <div class="field-label">Category</div>
            <div class="field-value" th:text="${category}">Category</div>
        </div>

        <div class="field">
            <div class="field-label">Subject</div>
            <div class="field-value" th:text="${subject}">Subject</div>
        </div>

        <div class="field">
            <div class="field-label">Message</div>
            <div class="message-body" th:text="${message}">Enquiry message</div>
        </div>
    </div>

    <div class="footer">
        Elmkusoma &middot; This message was generated by a public website submission.
    </div>
</div>
</body>
</html>
