# Schema lifecycle for the SHARED test database.
#
# Was "create-drop". That value was the root cause of a large, misleading failure
# class across the suite: several test classes start their own Spring context, and with
# create-drop every context DROPS the whole schema when it closes. Whichever context shut
# down last deleted the tables out from under every context still running, so unrelated
# tests failed with `relation "users" does not exist` / `relation "parent_student_links"
# does not exist` - including tests that pass when run alone. That was reported as a
# misleading DuplicateKeyException on the INSERT into users.
#
# "create" builds the schema from the entity model and leaves it in place, so contexts
# created later in the same run find the tables already there instead of racing a drop.
# It is test-only configuration: this file is loaded exclusively by @TestPropertySource and
# has no effect on any other profile, environment or the application database.
#
# Limitation, stated plainly: "create" removes the cross-context drop race, but two contexts
# starting at the SAME instant can still both try to create the schema. If a clean run ever
# reproduces that, the durable fix is a dedicated database or schema per run (or
# Testcontainers), not a further tweak of this setting.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.flyway.enabled=false

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
