server:
  port: 8080

spring:
  application:
    name: elmkusoma-core
  main:
    allow-bean-definition-overriding: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:elmkusoma}?sslmode=disable
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 25
          batch_versioned_data: true

  flyway:
    enabled: true
    out-of-order: true
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 3600000
  refresh-token-expiration-ms: 604800000

livekit:
  server:
    url: ${LIVEKIT_URL:ws://localhost:7880}
    api-key: ${LIVEKIT_API_KEY:}
    api-secret: ${LIVEKIT_API_SECRET:}
  room:
    empty-timeout: 300
    max-participants: 10000
  ingress:
    enabled: ${LIVEKIT_INGRESS_ENABLED:false}
    whip-endpoint: ${LIVEKIT_WHIP_ENDPOINT:}
    rtmp-endpoint: ${LIVEKIT_RTMP_ENDPOINT:}
    srt-endpoint: ${LIVEKIT_SRT_ENDPOINT:}
  egress:
    enabled: ${LIVEKIT_EGRESS_ENABLED:false}
    output-bucket: ${LIVEKIT_EGRESS_BUCKET:}
    output-path: ${LIVEKIT_EGRESS_PATH:recordings/}

services:
  media:
    url: ${MEDIA_SERVICE_URL:http://localhost:8083}
  realtime:
    url: ${REALTIME_SERVICE_URL:http://localhost:8081}
  workers:
    url: ${WORKERS_SERVICE_URL:http://localhost:8082}

logging:
  level:
    tz.elmkusoma: INFO
    org.springframework.security: WARN
