server:
  port: 8080

spring:
  application:
    name: elmkusoma-core

  datasource:
    url: jdbc:postgresql://localhost:5432/elmukusoma?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:tally}
    password: ${DB_PASSWORD:tally}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 25
          batch_versioned_data: true

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

jwt:
  secret: Y2hvb3NlYS1hLXNlY3VyZS1zZWNyZXQta2V5LWZvci1lbG1rdXNvbWEtand0LXRva2VuLWdlbmVyYXRpb24tMjAyNA==
  access-token-expiration-ms: 3600000
  refresh-token-expiration-ms: 604800000

logging:
  level:
    tz.elmkusoma: DEBUG
    org.springframework.security: DEBUG
