spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

elmkusoma:
  identity:
    # Audit B-04: production requires email verification before login. Off by default elsewhere so
    # seeded/e2e fixtures are not locked out.
    require-verified-email: true

  flyway:
    enabled: true
    validate-on-migrate: true
    out-of-order: true
    baseline-version: 6
    placeholders:
      # Production must not ship logins whose password hash is published in the repository.
      demoSeedDeactivate: "true"

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 2000

  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# Prod overrides the dev fallback secret: the well-known local default must
# never be usable in production. Boot fails fast when LIVEKIT_API_SECRET is
# unset (same fail-closed posture as JWT_SECRET).
livekit:
  server:
    api-secret: ${LIVEKIT_API_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    tz.elmkusoma: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
