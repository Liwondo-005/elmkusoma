server:
  port: 8081

spring:
  application:
    name: elmkusoma-realtime
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

jwt:
  # No default: the service fails fast at startup without JWT_SECRET instead of
  # signing tokens with a public value.
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
