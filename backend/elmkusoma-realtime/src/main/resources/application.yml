server:
  port: 8081

spring:
  application:
    name: elmkusoma-realtime
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

jwt:
  secret: ${JWT_SECRET:defaultSecretKeyThatShouldBeOverriddenInProduction}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
