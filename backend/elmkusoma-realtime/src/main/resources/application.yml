server:
  port: 8081

spring:
  application:
    name: elmkusoma-realtime
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

jwt:
  # Required, environment-authoritative: same contract as elmkusoma-core/media.
  # No embedded default — a missing JWT_SECRET must fail startup loudly
  # instead of silently signing with a weak placeholder.
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
