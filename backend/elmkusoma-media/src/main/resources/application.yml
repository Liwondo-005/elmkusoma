spring:
  application:
    name: elmkusoma-media
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:elmkusoma}
    username: ${DB_USERNAME:elmkusoma}
    password: ${DB_PASSWORD:elmkusoma}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    # Dedicated history table: core owns flyway_schema_history (V001-V113+);
    # media manages only its own db/migration scripts (V001...) here.
    table: flyway_media_history
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 60000
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB

server:
  port: ${SERVER_PORT:8083}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:elmkusoma-media}

# Storage backend: "minio" (default, production) or "local" (filesystem store
# used where a MinIO process is unavailable). Same API, same database rows.
media:
  storage: ${MEDIA_STORAGE:minio}
  local:
    dir: ${MEDIA_LOCAL_DIR:${java.io.tmpdir}/elmkusoma-media}
    base-url: ${MEDIA_LOCAL_BASE_URL:http://localhost:8083}

jwt:
  # Required, environment-authoritative: same contract as elmkusoma-core.
  # No embedded default — a missing JWT_SECRET must fail startup loudly
  # instead of silently signing with an invalid (non-Base64) placeholder.
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    tz.elmkusoma.media: INFO
    io.minio: WARN
